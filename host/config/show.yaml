# Show-Konfiguration fuer die Lightshow-Bridge.
#
# Diese Datei wird von der Web-UI geschrieben. Eigene Kommentare gehen dabei
# verloren -- Notizen also besser in docs/ ablegen.
#
#   python -m lightshow --check     Konfiguration pruefen
#   python -m lightshow --dry-run   ohne Hardware laufen lassen

serial_port: /dev/ttyACM0
rate_hz: 100
global_offset_ms: 0
bus_latency_limit_ms: 150
tx_ports:
- id: 0
  name: eule_sender
  format: ppm
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 1
  name: falke_sender
  format: ppm
  polarity: normal
  nchan: 8
  frame_us: 22500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 2
  name: buchse3
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35400
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 3
  name: buchse4
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 4
  name: buchse5
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 5
  name: buchse6
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 6
  name: buchse7
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
- id: 7
  name: buchse8
  format: 'off'
  polarity: normal
  nchan: 16
  frame_us: 35500
  sync_us: 400
  min_us: 1000
  max_us: 2000
models:
- name: eule
  tx_port: 0
  tx_offset: 8
  channels:
  - role: cue
    quantize: 32
    failsafe: 1000
  - role: hue
    failsafe: 1500
  - role: brightness
    failsafe: 1000
  - role: param
    failsafe: 1500
  - role: cue
    quantize: 32
    failsafe: 1000
  - role: hue
    failsafe: 1500
  - role: brightness
    failsafe: 1000
  - role: param
    failsafe: 1500
  - role: cue
    quantize: 32
    failsafe: 1000
  - role: hue
    failsafe: 1500
  - role: brightness
    failsafe: 1000
  - role: param
    failsafe: 1500
  - role: cue
    quantize: 32
    failsafe: 1000
  - role: hue
    failsafe: 1500
  - role: brightness
    failsafe: 1000
  - role: param
    failsafe: 1500
  bus:
    relays:
    - name: rauch
      failsafe: false
    - name: blitz
      failsafe: false
  plane:
    board: pico
    airframe: motor
    sbus_pin: 5
    max_brightness: 200
    render_hz: 200
    outputs:
    - name: flaeche_links
      pin: 2
      count: 30
      segments:
      - name: aussen
        start: 0
        count: 30
        zone: 0
        offset: 0
        reverse: false
        place:
          view: top
          x1: 0.1015
          y1: 0.3585
          x2: 0.4333
          y2: 0.3566
    - name: flaeche_rechts
      pin: 3
      count: 30
      segments:
      - name: aussen
        start: 0
        count: 30
        zone: 0
        offset: 0
        reverse: true
        place:
          view: top
          x1: 0.8903
          y1: 0.36
          x2: 0.5451
          y2: 0.3605
    relays:
    - name: rauch
      pin: 7
      active_low: true
      min_on_ms: 200
      min_off_ms: 200
    - name: blitz
      pin: 8
      active_low: false
      min_on_ms: 0
      min_off_ms: 0
    nav_lights:
    - output: 0
      index: 0
      color: [255, 0, 0]
    - output: 1
      index: 0
      color: [0, 255, 0]
    - output: 0
      index: 29
      color: [255, 255, 255]
- name: falke
  tx_port: 1
  tx_offset: 0
  channels:
  - role: cue
    quantize: 32
    failsafe: 1000
  - role: hue
    failsafe: 1500
  - role: brightness
    failsafe: 1000
  - role: param
    failsafe: 1500
  bus:
    relays:
    - name: landelicht
      failsafe: false
  plane:
    board: modell-2led-2relais-v1
    airframe: motor
    sbus_pin: 5
    max_brightness: 200
    render_hz: 200
    outputs:
    - name: rumpf
      pin: 2
      count: 40
      segments:
      - name: ganz
        start: 0
        count: 40
        zone: 0
        offset: 0
        reverse: false
    relays:
    - name: landelicht
      pin: 6
      active_low: true
      min_on_ms: 200
      min_off_ms: 200
    nav_lights:
    - output: 0
      index: 0
      color: [255, 0, 0]
    - output: 0
      index: 39
      color: [255, 255, 255]
